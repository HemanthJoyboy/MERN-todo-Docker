server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router / SPA fallback: any unknown path serves index.html
    # and lets the client-side app handle routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built JS/CSS assets aggressively (Vite fingerprints filenames,
    # so a new deploy automatically gets a new filename -> safe to cache hard).
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
